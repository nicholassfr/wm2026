<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WM 2026 - Vorhersage</title>
<style>
:root{--bg:#0a0e16;--bg2:#0e1420;--card:#141c2a;--card2:#18222f;--line:#23303f;--line2:#2c3a4c;
--ac:#2ee6a0;--ac-d:#0f9b6b;--ac2:#f5c451;--neg:#e0533d;--mut:#8a9bb2;--txt:#eef3f9;--r:14px;}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,Segoe UI,Roboto,sans-serif;
background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;line-height:1.45}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
background:repeating-linear-gradient(90deg,rgba(255,255,255,.014) 0 64px,transparent 64px 128px),
radial-gradient(75% 45% at 50% 0,rgba(46,230,160,.06),transparent 62%)}
header,nav,main{position:relative;z-index:1}
.ic{width:1.05em;height:1.05em;vertical-align:-.16em;flex:none}
.mh-p{font-weight:800;font-size:15px;margin-top:3px;font-variant-numeric:tabular-nums}
header{position:relative;overflow:hidden;padding:24px 16px 18px;text-align:center;background:radial-gradient(120% 130% at 50% -25%,#1d3458 0,#13203a 38%,var(--bg) 78%);border-bottom:1px solid var(--line)}
.pitch{position:absolute;inset:0;width:100%;height:100%;opacity:.08;pointer-events:none}
header h1,header .sub{position:relative;z-index:1}
h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;text-shadow:0 2px 12px rgba(0,0,0,.4)} .sub{color:var(--mut);font-size:12px;margin-top:3px}
nav{display:flex;gap:6px;padding:10px;background:rgba(10,14,22,.82);backdrop-filter:blur(10px);position:sticky;top:0;z-index:9;overflow-x:auto;border-bottom:1px solid var(--line)}
nav button{flex:1;min-width:118px;padding:11px 8px;border:1px solid transparent;border-radius:12px;background:var(--card);color:var(--mut);font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:7px}
nav button svg{width:17px;height:17px;flex:none}
nav button:hover{color:var(--txt)}
nav button.on{background:linear-gradient(135deg,var(--ac),var(--ac-d));color:#04140d;font-weight:800;box-shadow:0 4px 14px rgba(46,230,160,.28)}
main{max-width:820px;margin:0 auto;padding:14px}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.22)}
select,input[type=number]{width:100%;padding:11px;border-radius:11px;background:var(--bg2);color:var(--txt);border:1px solid var(--line2);font-size:15px;transition:.15s}
select:focus,input:focus{outline:0;border-color:var(--ac)}
label{font-size:11px;color:var(--mut);display:block;margin:9px 0 4px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.row{display:flex;gap:10px}.row>div{flex:1}
.flag{width:1.4em;height:1.4em;border-radius:50%;vertical-align:-.34em;object-fit:cover;box-shadow:0 0 0 1px rgba(255,255,255,.12);background:var(--bg2)}
.mh{display:flex;align-items:center;gap:12px;margin:2px 0 14px}
.mh-t{flex:1;text-align:center}.mh-t .flag{width:52px;height:52px;display:block;margin:0 auto;vertical-align:0;box-shadow:0 0 0 1px rgba(255,255,255,.14),0 6px 16px rgba(0,0,0,.4)}
.mh-n{font-weight:700;font-size:15px;margin-top:6px}.mh-vs{color:var(--mut);font-weight:800;font-size:13px}
.venue{display:inline-block;background:var(--bg2);border:1px solid var(--line2);color:var(--mut);border-radius:8px;padding:2px 9px;font-size:12px}
.bar{height:30px;border-radius:9px;background:var(--bg2);overflow:hidden;display:flex;margin:10px 0;border:1px solid var(--line)}
.bar i{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#04140d;white-space:nowrap}
.bw{background:linear-gradient(135deg,var(--ac),var(--ac-d))} .bd{background:#56657a;color:#fff!important} .bl{background:linear-gradient(135deg,#f5c451,#caa033)}
.big{font-size:15px;font-weight:800;margin:8px 0}
.scores{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.scores span{background:var(--bg2);border:1px solid var(--line2);border-radius:9px;padding:6px 11px;font-size:14px}
.stat{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.stat:last-child{border-bottom:0}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 7px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em;background:var(--card)}
tr:hover td{background:rgba(255,255,255,.025)}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.win{color:var(--ac);font-weight:700}.gr{color:var(--mut)}
.gtag{display:inline-block;background:var(--bg2);border:1px solid var(--line2);border-radius:6px;padding:1px 7px;font-size:11px;font-weight:600}
.hide{display:none}
.muted{color:var(--mut);font-size:12px;margin-top:10px}
.sq{margin-top:10px}
.sq summary{cursor:pointer;color:var(--ac);font-size:13px;font-weight:600;padding:6px 0;list-style:none}
.pls{max-height:240px;overflow:auto;display:flex;flex-direction:column;margin-top:4px}
.pl{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 4px;border-bottom:1px solid var(--line)}
.pl.out{opacity:.4;text-decoration:line-through}
.pl span:first-of-type{flex:1}
.pl input{width:18px;height:18px;accent-color:var(--ac)}
table input[type=number]{padding:6px;width:62px;font-size:13px}
.val{color:var(--ac);font-weight:800}
.subnav{display:flex;gap:6px;margin-bottom:12px}
.subnav .sub{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--mut);font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.subnav .sub.on{background:linear-gradient(135deg,var(--ac2),#caa033);color:#1a1407;border-color:transparent}
.mini{padding:7px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ac);font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.tb{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line)}
.tb .rk{width:18px;color:var(--mut);font-size:12px;text-align:right}
.tb .fl{font-size:20px;line-height:0}.tb .flag{width:24px;height:24px}
.tb .nm{width:118px;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb .track{flex:1;height:20px;background:var(--bg2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.tb .fill{display:block;height:100%;background:linear-gradient(90deg,var(--ac-d),var(--ac));border-radius:5px}
.tb .pc{width:46px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
#vmt td input{width:50px;padding:4px;margin-right:2px}
::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
@media(max-width:600px){.mh-t .flag{font-size:32px}.tb .nm{width:80px}}
</style></head>
<body>
<header>
<svg class="pitch" viewBox="0 0 300 180" preserveAspectRatio="xMidYMid slice" fill="none" stroke="#cfe8ff" stroke-width="1.3">
<rect x="3" y="3" width="294" height="174" rx="6"/><line x1="150" y1="3" x2="150" y2="177"/>
<circle cx="150" cy="90" r="30"/><circle cx="150" cy="90" r="2.5" fill="#cfe8ff" stroke="none"/>
<rect x="3" y="52" width="46" height="76"/><rect x="251" y="52" width="46" height="76"/>
<rect x="3" y="70" width="20" height="40"/><rect x="277" y="70" width="20" height="40"/></svg>
<h1>⚽ WM 2026</h1><div class="sub">Vorhersage · Value · Tipps</div></header>
<nav>
<button class="on" data-t="match"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg>Spiel</button>
<button data-t="group"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="3" y="16" width="18" height="4" rx="1"/></svg>Gruppen</button>
<button data-t="sim"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 4h12v4a6 6 0 0 1-12 0V4Z"/><path d="M6 6H3v2a3 3 0 0 0 3 3M18 6h3v2a3 3 0 0 1-3 3M9 18h6M8 21h8"/></svg>Weltmeister</button>
<button data-t="value"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>Value</button>
<button data-t="stake"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h18v10H3z"/><circle cx="12" cy="12" r="2.5"/><path d="M7 12h.01M17 12h.01"/></svg>Tippen</button>
</nav>
<main>
<section id="match">
  <div class="card">
    <div class="row">
      <div><label>Team 1 (Heim)</label><select id="t1"></select></div>
      <div><label>Team 2 (Gast)</label><select id="t2"></select></div>
    </div>
    <label>Spielort (optional — für Heimvorteil/Höhe)</label>
    <select id="venue"></select>
    <details class="sq"><summary id="sum1">Ausfälle wählen</summary><div id="squad1" class="pls"></div></details>
    <details class="sq"><summary id="sum2">Ausfälle wählen</summary><div id="squad2" class="pls"></div></details>
  </div>
  <div class="card" id="out"></div>
  <div class="card">
    <div style="font-size:13px;color:var(--mut);margin-bottom:8px"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-3px"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.4c0-1.1 1.1-1.7 2.5-1.7s2.5.6 2.5 1.7-1.1 1.7-2.5 1.7-2.5.6-2.5 1.7 1.1 1.7 2.5 1.7 2.5-.6 2.5-1.7"/></svg> Quoten-Check — deine Quoten → Value (EV)</div>
    <div class="row">
      <div><label>Quote Sieg 1</label><input id="o1" type="number" step="0.01" placeholder="z.B. 2.10"></div>
      <div><label>Quote Remis</label><input id="ox" type="number" step="0.01" placeholder="z.B. 3.40"></div>
      <div><label>Quote Sieg 2</label><input id="o2" type="number" step="0.01" placeholder="z.B. 3.20"></div>
    </div>
    <div class="row" style="margin-top:8px">
      <div><label>Quote Über 2,5</label><input id="oov" type="number" step="0.01" placeholder="z.B. 2.05"></div>
      <div><label>Quote Unter 2,5</label><input id="oun" type="number" step="0.01" placeholder="z.B. 1.75"></div>
    </div>
    <div id="oddsout" style="margin-top:8px"></div>
  </div>
</section>
<section id="value" class="hide"><div class="card">
  <div class="subnav"><button class="sub on" data-v="vOut"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 4h12v4a6 6 0 0 1-12 0V4Z"/><path d="M9 18h6M8 21h8M12 14v4"/></svg> Weltmeister</button><button class="sub" data-v="vMatch"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg> Pro Spiel</button></div>
  <div id="vOut"></div>
  <div id="vMatch" class="hide"></div>
</div></section>
<section id="group" class="hide"><div class="card" id="grpwrap"></div></section>
<section id="sim" class="hide"><div class="card" id="simwrap"></div></section>
<section id="stake" class="hide"><div class="card" id="stakewrap"></div></section>
</main>

function buildSquad(divId,team,outSet){
  const ps=DATA.players[team]||[], box=$('#'+divId);
  box.innerHTML=ps.map((p,i)=>`<label class="pl${outSet.has(p.name)?' out':''}"><input type="checkbox" data-i="${i}" ${outSet.has(p.name)?'':'checked'}> <span>${p.name}</span> <span class="gr">${p.role||p.pos} · ${p.value}M · ${p.caps||0} LS</span></label>`).join('');
  box.onchange=e=>{const i=+e.target.dataset.i,name=ps[i].name;
    if(e.target.checked)outSet.delete(name);else outSet.add(name);
    e.target.closest('.pl').classList.toggle('out',!e.target.checked);renderMatch();};
}
$('#t1').addEventListener('change',()=>{outH.clear();buildSquad('squad1',$('#t1').value,outH);renderMatch();});
$('#t2').addEventListener('change',()=>{outA.clear();buildSquad('squad2',$('#t2').value,outA);renderMatch();});
$('#venue').addEventListener('change',renderMatch);
['#o1','#ox','#o2','#oov','#oun'].forEach(id=>$(id).addEventListener('input',renderMatch));
buildSquad('squad1',$('#t1').value,outH);
buildSquad('squad2',$('#t2').value,outA);
renderMatch();
// Value-Bereich (Weltmeister-Markt: Modell vs Buchmacher), nach Stufen
function renderValue(){
  const sim={}; DATA.sim.forEach(s=>sim[s.team]=s.titel);
  const odds=DATA.odds; let impl={},over=0;
  for(const t in odds){impl[t]=1/odds[t];over+=impl[t];}
  const rows=Object.keys(odds).map(t=>{const mp=(sim[t]||0)/100,fair=impl[t]/over,q=odds[t];
    return {t,mp,fair,q,ev:mp*q-1,fak:fair>0?mp/fair:0,
            stufe:q<=15?'Favoriten':(q<=80?'Mittelfeld':'Außenseiter')};});
  const dogs=rows.filter(r=>r.stufe==='Außenseiter'&&r.ev>0.05).sort((a,b)=>b.ev-a.ev);
  let h=`<div class="muted">Modell vs. Buchmacher · <b>×</b> = mehr Chance laut Modell · <b class="val">EV&gt;0 = Value</b> · Quote editierbar</div>`;
  if(dogs.length) h+=`<div class="card" style="background:#13241c;border-color:var(--ac);margin:10px 0;padding:12px">`+
    `<b class="val">${ICON.zap} Außenseiter mit Value</b><br>${dogs.map(d=>`${DATA.teams[d.t].fl} ${DATA.teams[d.t].de} — Quote ${d.q}, ${d.fak.toFixed(1)}× mehr Chance (EV +${(d.ev*100).toFixed(0)}%)`).join('<br>')}</div>`;
  ['Favoriten','Mittelfeld','Außenseiter'].forEach(st=>{
    const teil=rows.filter(r=>r.stufe===st).sort((a,b)=>b.ev-a.ev);
    h+=`<div class="big" style="margin-top:14px">${st}</div>`;
    h+='<table><tr><th>Team</th><th class="n">Modell</th><th class="n">Buchm.</th><th class="n">×</th><th class="n">Quote</th><th class="n">EV</th></tr>';
    teil.forEach(r=>{const ok=r.ev>0.05;
      h+=`<tr><td>${DATA.teams[r.t]?DATA.teams[r.t].fl+' '+DATA.teams[r.t].de:r.t}</td>`+
        `<td class="n">${(r.mp*100).toFixed(1)}%</td>`+
        `<td class="n gr">${(r.fair*100).toFixed(1)}%</td>`+
        `<td class="n ${r.fak>=1.5?'val':'gr'}">${r.fak.toFixed(1)}×</td>`+
        `<td class="n"><input type="number" step="0.5" class="oq" data-t="${r.t}" value="${r.q}"></td>`+
        `<td class="n ${ok?'val':'gr'}">${r.ev>0?'+':''}${(r.ev*100).toFixed(0)}%</td></tr>`;});
    h+='</table>';
  });
  $('#vOut').innerHTML=h;
  $('#vOut').onchange=e=>{if(e.target.classList.contains('oq')){
    const v=parseFloat(e.target.value); if(v>1){DATA.odds[e.target.dataset.t]=v; renderValue();}}};
}
function renderValueMatches(){
  const T=DATA.teams,fx=DATA.fixtures;
  let h=`<div class="muted">Quoten eintragen → <b class="val">EV&gt;0 = Value</b> · ${ICON.zap} = Value auf dem Außenseiter</div>`;
  h+=`<div style="margin:8px 0;display:flex;gap:6px;flex-wrap:wrap"><button class="mini" id="sortev">⬇ nach Value</button> <button class="mini" id="sortdog">${ICON.zap} Außenseiter-Chance</button> <button class="mini" id="sortdt">nach Datum</button></div>`;
  h+='<table id="vmt"><tr><th>Spiel</th><th class="n">1/X/2<br>Modell</th><th>deine Quoten (1·X·2)</th><th class="n">Value</th></tr>';
  fx.forEach((f,i)=>{const r=predict(f.heim,f.gast,f.stadt),fp=[1/r.pw,1/r.pd,1/r.pl];
    const dogHome=r.pw<r.pl, dogTeam=dogHome?T[f.heim].de:T[f.gast].de, dogp=Math.min(r.pw,r.pl), dogk=dogHome?0:2;
    h+=`<tr data-i="${i}" data-pw="${r.pw}" data-pd="${r.pd}" data-pl="${r.pl}" data-dogp="${dogp}" data-dogk="${dogk}">`+
      `<td>${T[f.heim].fl} ${T[f.heim].de} – ${T[f.gast].fl} ${T[f.gast].de}<br><span class="gr">${f.gruppe} · ${f.datum.slice(5)} · ${ICON.zap} ${dogTeam} ${(dogp*100).toFixed(0)}%</span></td>`+
      `<td class="n gr">${(r.pw*100).toFixed(0)}/${(r.pd*100).toFixed(0)}/${(r.pl*100).toFixed(0)}</td>`+
      `<td><input class="mo" data-i="${i}" type="number" step="0.01" placeholder="${fp[0].toFixed(2)}">`+
      `<input class="mo" data-i="${i}" type="number" step="0.01" placeholder="${fp[1].toFixed(2)}">`+
      `<input class="mo" data-i="${i}" type="number" step="0.01" placeholder="${fp[2].toFixed(2)}"></td>`+
      `<td class="n gr" id="ev${i}">–</td></tr>`;});
  $('#vMatch').innerHTML=h+'</table>';
  $('#vMatch').oninput=e=>{if(!e.target.classList.contains('mo'))return;
    const i=+e.target.dataset.i, row=document.querySelector('#vmt tr[data-i="'+i+'"]');
    const ps=[+row.dataset.pw,+row.dataset.pd,+row.dataset.pl], dogk=+row.dataset.dogk;
    const f=DATA.fixtures[i], labs=[T[f.heim].de,'X',T[f.gast].de];
    const ins=[...row.querySelectorAll('.mo')].map(x=>parseFloat(x.value));
    let best=null; ins.forEach((q,k)=>{if(q>1){const ev=ps[k]*q-1; if(!best||ev>best.ev)best={ev,k};}});
    const cell=document.querySelector('#ev'+i);
    if(!best){cell.textContent='–';cell.className='n gr';row.dataset.bestev='-99';}
    else{const dog=(best.k===dogk&&best.ev>0)?' '+ICON.zap:'';
      cell.innerHTML=`${best.ev>0?'+':''}${(best.ev*100).toFixed(0)}% <span class="gr">${labs[best.k]}${dog}</span>`;
      cell.className='n '+(best.ev>0?'val':'gr');row.dataset.bestev=best.ev;}};
  const reorder=cmp=>{const t=document.querySelector('#vmt');[...t.querySelectorAll('tr[data-i]')].sort(cmp).forEach(r=>t.appendChild(r));};
  document.querySelector('#sortev').onclick=()=>reorder((a,b)=>(+(b.dataset.bestev||-99))-(+(a.dataset.bestev||-99)));
  document.querySelector('#sortdog').onclick=()=>reorder((a,b)=>(+b.dataset.dogp)-(+a.dataset.dogp));
  document.querySelector('#sortdt').onclick=()=>reorder((a,b)=>(+a.dataset.i)-(+b.dataset.i));
}
renderValue();
renderValueMatches();
document.querySelectorAll('.subnav .sub').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.subnav .sub').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  $('#vOut').classList.toggle('hide',b.dataset.v!=='vOut');
  $('#vMatch').classList.toggle('hide',b.dataset.v!=='vMatch');
}));
// Gruppenspiele
function renderGroups(){
  let h='<div class="tablewrap"><table><tr><th>Gr</th><th>Spiel</th><th class="n">1/X/2</th><th>Tipp</th><th class="n">Ü2,5</th><th class="n">BTTS</th></tr>';
  for(const f of DATA.fixtures){
    const r=predict(f.heim,f.gast,f.stadt),T=DATA.teams;
    const tip=r.pw>=r.pd&&r.pw>=r.pl?T[f.heim].de:(r.pl>=r.pd?T[f.gast].de:'X');
    h+=`<tr><td><span class="gtag">${f.gruppe}</span></td>
      <td>${T[f.heim].fl} ${T[f.heim].de} <span class="gr">–</span> ${T[f.gast].fl} ${T[f.gast].de}</td>
      <td class="n">${(r.pw*100).toFixed(0)}/${(r.pd*100).toFixed(0)}/${(r.pl*100).toFixed(0)}</td>
      <td class="win">${tip}</td>
      <td class="n">${ovChip(r.o25)}</td>
      <td class="n">${btChip(r.btts)}</td></tr>`;}
  $('#grpwrap').innerHTML=h+'</table></div><div class="muted"><b style="color:var(--ac)">grün</b> = überdurchschnittlich · <b style="color:var(--neg)">rot</b> = unter Schnitt</div>';
}
// Simulation
function renderSim(){
  if(!DATA.sim.length){$('#simwrap').innerHTML='<p class="gr">Keine Daten.</p>';return;}
  const mx=Math.max(...DATA.sim.map(s=>s.titel))||1;
  let h=`<div class="big">${ICON.trophy} Titelchancen</div>`;
  DATA.sim.slice(0,24).forEach((s,i)=>{const T=DATA.teams[s.team];
    h+=`<div class="tb"><span class="rk">${i+1}</span><span class="fl">${T?T.fl:'🏳️'}</span>`+
       `<span class="nm">${T?T.de:s.team}</span>`+
       `<span class="track"><span class="fill" style="width:${(s.titel/mx*100).toFixed(1)}%"></span></span>`+
       `<span class="pc">${s.titel.toFixed(1)}%</span></div>`;});
  $('#simwrap').innerHTML=h+'<div class="muted">10.000 simulierte Turniere · Balken = Titelwahrscheinlichkeit</div>';
}
// ---- Tipp-Tool: klare Empfehlung pro Spieltag ----
let STK=null, STK_ODDS={}, STK_DATE=null;
const STK_LAB=['Sieg 1','Remis','Sieg 2','Über 2,5','Unter 2,5'];
function stkProb(r,m){return [r.pw,r.pd,r.pl,r.o25,1-r.o25][m];}
function dlabel(d){return d.slice(8)+'.'+d.slice(5,7)+'.';}
function renderStake(){
  const fx=DATA.fixtures;
  if(!STK) STK=fx.map(f=>predict(f.heim,f.gast,f.stadt));
  const dates=[...new Set(fx.map(f=>f.datum))].sort();
  if(!STK_DATE||!dates.includes(STK_DATE)) STK_DATE=dates[0];
  const g=id=>(document.getElementById(id)||{}).value;
  let h=`<div class="muted">${ICON.coin} Spieltag wählen → klare Empfehlung. Quoten eintragen → Value-Wetten mit Einsatz (Kelly).</div>`;
  h+=`<div class="row" style="margin:10px 0">
    <div><label>Bankroll (€)</label><input id="brIn" type="number" value="${g('brIn')||1000}"></div>
    <div><label>Kelly-Anteil (%)</label><input id="kfIn" type="number" value="${g('kfIn')||25}"></div>
    <div><label>Max je Wette (%)</label><input id="mxIn" type="number" value="${g('mxIn')||5}"></div></div>`;
  h+=`<div class="subnav" style="flex-wrap:wrap">`+dates.map(d=>`<button class="sub${d===STK_DATE?' on':''}" data-d="${d}">${dlabel(d)}</button>`).join('')+`</div>`;
  h+=`<div id="stkRec"></div><div id="stkDog"></div><div id="stkCards" style="margin-top:12px"></div>`;
  $('#stakewrap').innerHTML=h;
  $('#stakewrap').querySelectorAll('.subnav .sub').forEach(b=>b.onclick=()=>{STK_DATE=b.dataset.d; renderStake();});
  $('#stakewrap').oninput=e=>{ if(e.target.classList.contains('so')) STK_ODDS[e.target.dataset.k]=e.target.value; stkCompute(); };
  renderCards(); stkCompute();
}
function renderCards(){
  const fx=DATA.fixtures,T=DATA.teams; let h='';
  fx.forEach((f,i)=>{ if(f.datum!==STK_DATE) return; const r=STK[i];
    const pk=[r.pw,r.pd,r.pl], wi=pk.indexOf(Math.max(...pk));
    const pickL=['Sieg '+T[f.heim].de,'Unentschieden','Sieg '+T[f.gast].de][wi];
    h+=`<div style="border:1px solid #243043;border-radius:12px;padding:11px;margin-bottom:9px">
      <div style="font-weight:700;margin-bottom:3px">${T[f.heim].fl} ${T[f.heim].de} <span class="gr">–</span> ${T[f.gast].fl} ${T[f.gast].de} <span class="gr" style="font-weight:400;font-size:12px">${f.gruppe}</span></div>
      <div class="gr" style="font-size:12.5px;margin-bottom:7px">Modell-Tipp: <b style="color:var(--ac)">${pickL} ${(pk[wi]*100).toFixed(0)}%</b> · faire Q ${(1/r.pw).toFixed(2)}/${(1/r.pd).toFixed(2)}/${(1/r.pl).toFixed(2)} · Über 2,5 ${ovChip(r.o25)}</div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center">`+
      [0,1,2,3,4].map(m=>`<span style="font-size:11px;color:var(--mut)">${['1','X','2','Ü','U'][m]}</span><input class="so" data-k="${i}_${m}" type="number" step="0.01" style="width:56px" placeholder="${(1/stkProb(r,m)).toFixed(2)}" value="${STK_ODDS[i+'_'+m]||''}">`).join('')+
      `</div></div>`;
  });
  $('#stkCards').innerHTML=`<div class="big" style="margin-bottom:6px">Spiele am ${dlabel(STK_DATE)}</div>`+h;
}
function stkCompute(){
  const num=id=>{const el=document.getElementById(id);return el?parseFloat(el.value):NaN;};
  const br=Math.max(0,num('brIn')||0), kf=Math.max(0,(num('kfIn')||0)/100), mx=Math.max(0,(num('mxIn')||0)/100);
  const fx=DATA.fixtures,T=DATA.teams; let bets=[];
  fx.forEach((f,i)=>{ if(f.datum!==STK_DATE) return; const r=STK[i];
    [0,1,2,3,4].forEach(m=>{const q=parseFloat(STK_ODDS[i+'_'+m]); if(q>1){const p=stkProb(r,m),ev=p*q-1;
      if(ev>0){const fr=(p*q-1)/(q-1), stake=Math.round(Math.min(br*kf*fr,br*mx)*100)/100;
        bets.push({m,q,ev,stake,match:T[f.heim].fl+' '+T[f.heim].de+' – '+T[f.gast].fl+' '+T[f.gast].de});}}});
  });
  bets.sort((a,b)=>b.ev-a.ev);
  let h='';
  if(bets.length){
    const tot=bets.reduce((s,b)=>s+b.stake,0), exp=bets.reduce((s,b)=>s+b.stake*b.ev,0);
    h=`<div class="card" style="background:#13241c;border-color:var(--ac);padding:13px;margin:0"><div class="big">${ICON.check} Empfehlung ${dlabel(STK_DATE)} — ${bets.length} Value-Wette(n)</div>`;
    bets.forEach((b,k)=>{h+=`<div class="stat"><span>${k+1}. <b>${STK_LAB[b.m]}</b> · ${b.match} @ ${b.q.toFixed(2)}</span><b class="val">${b.stake.toFixed(2)} € <span class="gr">EV +${(b.ev*100).toFixed(0)}%</span></b></div>`;});
    h+=`<div class="big" style="margin-top:8px">Gesamt: <span class="val">${tot.toFixed(0)} € Einsatz</span> · Erwartung <span class="val">+${exp.toFixed(0)} €</span></div></div>`;
  } else {
    let tips=[];
    fx.forEach((f,i)=>{ if(f.datum!==STK_DATE) return; const r=STK[i]; const m=T[f.heim].fl+' '+T[f.heim].de+' – '+T[f.gast].fl+' '+T[f.gast].de;
      const side=r.pw>=r.pl?'Sieg '+T[f.heim].de:'Sieg '+T[f.gast].de, conf=Math.max(r.pw,r.pl);
      tips.push({conf,txt:side+' · '+m,fair:1/conf});
      if(r.o25>=0.55) tips.push({conf:r.o25,txt:'Über 2,5 · '+m,fair:1/r.o25});
      if(r.o25<=0.34) tips.push({conf:1-r.o25,txt:'Unter 2,5 · '+m,fair:1/(1-r.o25)});
    });
    tips.sort((a,b)=>b.conf-a.conf); tips=tips.slice(0,5);
    h=`<div class="card" style="padding:13px;margin:0"><div class="big">${ICON.star} Sicherste Modell-Tipps ${dlabel(STK_DATE)} <span class="gr" style="font-weight:400">(noch ohne Quoten)</span></div>`;
    tips.forEach((t,k)=>{h+=`<div class="stat"><span>${k+1}. <b>${t.txt}</b></span><b>${(t.conf*100).toFixed(0)}% <span class="gr">faire Q ${t.fair.toFixed(2)}</span></b></div>`;});
    h+=`<div class="muted">Das sind die überzeugendsten Modell-Tipps — aber noch <b>kein Value</b>. „Lohnt sich" wird's erst, wenn deine Buchmacher-Quote <b>höher</b> ist als die faire Quote. Trag unten Quoten ein.</div></div>`;
  }
  $('#stkRec').innerHTML=h;
  // 🐺 Größter Außenseiter-Value des Spieltags (Sieg des unwahrscheinlicheren Teams)
  let dogVal=null, dogBel=null;
  fx.forEach((f,i)=>{ if(f.datum!==STK_DATE) return; const r=STK[i];
    const hd=r.pw<=r.pl, dM=hd?0:2, dP=hd?r.pw:r.pl, dT=hd?T[f.heim].de:T[f.gast].de, mt=T[f.heim].fl+' '+T[f.heim].de+' – '+T[f.gast].fl+' '+T[f.gast].de;
    if(!dogBel||dP>dogBel.p) dogBel={p:dP,team:dT,match:mt,fair:1/dP};
    const q=parseFloat(STK_ODDS[i+'_'+dM]);
    if(q>1){const ev=dP*q-1; if(ev>0){const fr=(dP*q-1)/(q-1), stake=Math.round(Math.min(br*kf*fr,br*mx)*100)/100;
      if(!dogVal||ev>dogVal.ev) dogVal={ev,q,team:dT,match:mt,stake};}}});
  let dh='';
  if(dogVal) dh=`<div class="card" style="background:#1c1206;border-color:var(--ac2);padding:12px;margin:10px 0 0"><b style="color:var(--ac2)">${ICON.zap} Größter Außenseiter-Value:</b> <b>${dogVal.team}</b> · ${dogVal.match} @ ${dogVal.q.toFixed(2)} → Einsatz <b class="val">${dogVal.stake.toFixed(2)} €</b> <span class="gr">(EV +${(dogVal.ev*100).toFixed(0)}%)</span></div>`;
  else if(dogBel) dh=`<div class="card" style="padding:12px;margin:10px 0 0"><b style="color:var(--ac2)">${ICON.zap} Stärkster Außenseiter (Modell):</b> <b>${dogBel.team}</b> · ${dogBel.match} ${(dogBel.p*100).toFixed(0)}% <span class="gr">· faire Quote ${dogBel.fair.toFixed(2)} — Value, wenn deine Quote höher ist</span></div>`;
  document.getElementById('stkDog').innerHTML=dh;
}
renderGroups();renderSim();renderStake();
// Tabs
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  ['match','group','sim','value','stake'].forEach(s=>$('#'+s).classList.add('hide'));
  $('#'+b.dataset.t).classList.remove('hide');
}));
</script>
