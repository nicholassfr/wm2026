<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WM 2026 - Vorhersage</title>
<style>
:root{--bg:#0f1419;--card:#1a2230;--ac:#23d18b;--ac2:#f4c542;--mut:#8aa0b4;--txt:#eaf2f8;}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);}
header{padding:18px 16px;text-align:center;background:linear-gradient(135deg,#16203a,#0f1419);border-bottom:1px solid #243043}
h1{margin:0;font-size:20px} .sub{color:var(--mut);font-size:13px;margin-top:4px}
nav{display:flex;gap:4px;padding:8px;background:#121a26;position:sticky;top:0;z-index:5;overflow-x:auto}
nav button{flex:1;min-width:130px;padding:11px 8px;border:0;border-radius:10px;background:#1c2735;color:var(--txt);font-size:14px;cursor:pointer}
nav button.on{background:var(--ac);color:#062013;font-weight:700}
main{max-width:780px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid #243043;border-radius:14px;padding:16px;margin-bottom:14px}
select{width:100%;padding:11px;border-radius:10px;background:#0f1722;color:var(--txt);border:1px solid #2b3a4d;font-size:15px}
label{font-size:12px;color:var(--mut);display:block;margin:8px 0 4px}
.row{display:flex;gap:10px}.row>div{flex:1}
.vs{text-align:center;color:var(--ac2);font-weight:700;margin:10px 0}
.bar{height:26px;border-radius:7px;background:#0f1722;overflow:hidden;display:flex;margin:6px 0}
.bar i{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#06140d;white-space:nowrap}
.bw{background:var(--ac)} .bd{background:#5a6b7d} .bl{background:var(--ac2)}
.big{font-size:15px;font-weight:700;margin:6px 0}
.scores{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.scores span{background:#0f1722;border:1px solid #2b3a4d;border-radius:8px;padding:6px 10px;font-size:14px}
.stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #243043;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 6px;text-align:left;border-bottom:1px solid #243043}
th{color:var(--mut);font-weight:600;position:sticky;top:52px;background:var(--card)}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.win{color:var(--ac);font-weight:700}.gr{color:var(--mut)}
.gtag{display:inline-block;background:#23344a;border-radius:5px;padding:1px 6px;font-size:11px;margin-right:4px}
.hide{display:none}
.muted{color:var(--mut);font-size:12px;margin-top:10px}
.sq{margin-top:10px}
.sq summary{cursor:pointer;color:var(--ac);font-size:13px;padding:6px 0;list-style:none}
.pls{max-height:240px;overflow:auto;display:flex;flex-direction:column;margin-top:4px}
.pl{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 4px;border-bottom:1px solid #1d2734}
.pl.out{opacity:.42;text-decoration:line-through}
.pl span:first-of-type{flex:1}
.pl input{width:17px;height:17px;accent-color:var(--ac)}
input[type=number]{background:#0f1722;color:var(--txt);border:1px solid #2b3a4d;border-radius:8px;padding:9px;font-size:14px;width:100%}
table input[type=number]{padding:5px;width:66px}
.val{color:var(--ac);font-weight:700}
.subnav{display:flex;gap:6px;margin-bottom:12px}
.subnav .sub{flex:1;padding:9px;border:0;border-radius:8px;background:#1c2735;color:var(--txt);font-size:13px;cursor:pointer}
.subnav .sub.on{background:var(--ac2);color:#1a1407;font-weight:700}
.mini{padding:6px 10px;border:0;border-radius:8px;background:#1c2735;color:var(--ac);font-size:12px;cursor:pointer}
#vmt td input{width:50px;padding:4px;margin-right:2px}
</style></head>
<body>
<header><h1>⚽ WM 2026 — Vorhersage-Modell</h1>
<div class="sub">ELO · Dixon-Coles · Marktwert · xG · Alter · Turniererfahrung · Kontext</div></header>
<nav>
<button class="on" data-t="match">Spiel-Vorhersage</button>
<button data-t="group">Gruppenspiele</button>
<button data-t="sim">Weltmeister</button>
<button data-t="value">💰 Value</button>
</nav>
<main>
<section id="match">
  <div class="card">
    <div class="row">
      <div><label>Team 1 (Heim)</label><select id="t1"></select></div>
      <div><label>Team 2 (Gast)</label><select id="t2"></select></div>
    </div>
    <label>Spielort (optional — für Heimvorteil/Höhe)</label>
    <select id="venue"></select>
    <details class="sq"><summary id="sum1">⚕ Ausfälle wählen</summary><div id="squad1" class="pls"></div></details>
    <details class="sq"><summary id="sum2">⚕ Ausfälle wählen</summary><div id="squad2" class="pls"></div></details>
  </div>
  <div class="card" id="out"></div>
  <div class="card">
    <div style="font-size:13px;color:var(--mut);margin-bottom:8px">💰 Quoten-Check (optional) — trag die Buchmacher-Quoten ein, dann seh ich den Value:</div>
    <div class="row">
      <div><label>Quote Sieg 1</label><input id="o1" type="number" step="0.01" placeholder="z.B. 2.10"></div>
      <div><label>Quote Remis</label><input id="ox" type="number" step="0.01" placeholder="z.B. 3.40"></div>
      <div><label>Quote Sieg 2</label><input id="o2" type="number" step="0.01" placeholder="z.B. 3.20"></div>
    </div>
    <div id="oddsout" style="margin-top:8px"></div>
  </div>
</section>
<section id="value" class="hide"><div class="card">
  <div class="subnav"><button class="sub on" data-v="vOut">🏆 Weltmeister</button><button class="sub" data-v="vMatch">⚽ Pro Spiel</button></div>
  <div id="vOut"></div>
  <div id="vMatch" class="hide"></div>
</div></section>
<section id="group" class="hide"><div class="card" id="grpwrap"></div></section>
<section id="sim" class="hide"><div class="card" id="simwrap"></div></section>
</main>

}
// Alters-korrigierte Spielerstaerke aus dem Marktwert.
function pq(value,age,pos){
  const K=DATA.konst, peak=(K.AGE_PEAK_POS[pos]!==undefined?K.AGE_PEAK_POS[pos]:27);
  let mult=1; if(age&&age>peak)mult=Math.min(K.AGE_RECOVER_CAP,Math.exp(K.AGE_RECOVER_K*(age-peak)));
  return Math.max(0,value||0)*mult;
}
// Wichtigkeit in Mio-Aequiv.: Talent (Marktwert) ODER Erfahrung (Laenderspiele).
// -> etablierte Veteranen (Neuer, Ronaldo) gelten als Stammspieler trotz Alters.
function pscore(p){return Math.max(pq(p.value,p.age,p.pos), DATA.konst.CAP_TO_Q*(p.caps||0));}
// Gewicht 0..1, konkav/saettigend -> Topstars nicht "sooo krass"; Keeper-Floor.
function pweight(p){const K=DATA.konst;
  const w=1-Math.exp(-pscore(p)/K.Q_SCALE);
  return Math.max(w, (K.POS_FLOOR[p.pos]!==undefined?K.POS_FLOOR[p.pos]:0));}
// Best-XI: pro Position die besten n nach pscore. {total=Summe Gewichte, names}.
function starters(players){
  const K=DATA.konst, by={GK:[],DEF:[],MID:[],FWD:[]};
  players.forEach(p=>{let pos=(p.pos in by)?p.pos:'MID'; by[pos].push(p);});
  let total=0; const names=new Set();
  for(const pos in K.FORMATION){const n=K.FORMATION[pos];
    by[pos].sort((a,b)=>pscore(b)-pscore(a)).slice(0,n).forEach(p=>{total+=pweight(p); names.add(p.name);});}
  return {total,names};
}
// Verlust-Anteil: Mischung aus Ersatz-Luecke (Tiefe federt ab) und absolutem
// Gewicht (jeder Leistungstraeger tut weh) ueber DEPTH_CREDIT.
function ausfallFrac(players,out){
  const K=DATA.konst, full=starters(players);
  if(full.total<=0) return 0;
  const keep=players.filter(p=>!out.has(p.name));
  const vorp=full.total-starters(keep).total;
  let absolut=0;
  players.forEach(p=>{if(out.has(p.name)&&full.names.has(p.name))absolut+=pweight(p);});
  const loss=K.DEPTH_CREDIT*vorp+(1-K.DEPTH_CREDIT)*absolut;
  return Math.min(1,Math.max(0,loss/full.total));
}
function mitAusfall(team,out){
  const t=DATA.teams[team];
  if(!out||!out.size) return {eff:t.eff,atk:t.atk};
  const K=DATA.konst, f=DATA.fld, ps=DATA.players[team]||[];
  const keep=ps.filter(p=>!out.has(p.name));
  // Ganzer Kader weg -> Staerke faellt auf ELO_FLOOR (kein "Favorit ohne Spieler").
  const frac=ausfallFrac(ps,out);
  const neff=t.eff-(t.eff-K.ELO_FLOOR)*frac;
  const q=p=>pq(p.value,p.age,p.pos), sum=arr=>arr.reduce((s,p)=>s+q(p),0);
  const fwd=sum(keep.filter(p=>p.pos==='FWD')), mid=sum(keep.filter(p=>p.pos==='MID')),
        dgk=sum(keep.filter(p=>p.pos==='DEF'||p.pos==='GK'));
  const atkv=fwd+0.5*mid, defv=dgk+0.3*mid;
  const share=(atkv+defv)>0?atkv/(atkv+defv):0.5;
  const natk=Math.min(K.FMAX,Math.max(K.FMIN,1+t.atk_xg_part+K.ATK_MV*((share-f.atk_mean)/f.atk_std)));
  return {eff:neff, atk:natk};
}
function lambdas(h,a,stadt,oh,oa){
  const T=DATA.teams,P=DATA.params,rh=T[h],ra=T[a];
  const eh=oh?oh.eff:rh.eff, ea=oa?oa.eff:ra.eff, ah=oh?oh.atk:rh.atk, aa=oa?oa.atk:ra.atk;
  const x=(eh-ea)/100;
  let lh=Math.exp(P.mu+P.eta*x)*ah*ra.def+rh.sp;
  let la=Math.exp(P.mu-P.eta*x)*aa*rh.def+ra.sp;
  const f=kontext(h,a,stadt);
  return[Math.max(0.05,lh*f[0]),Math.max(0.05,la*f[1])];
}
function predict(h,a,stadt,oh,oa){
  const[lh,la]=lambdas(h,a,stadt,oh,oa),rho=DATA.params.rho,M=10;
  let ph=[],pa=[];for(let k=0;k<=M;k++){ph.push(pois(k,lh));pa.push(pois(k,la));}
  let m=[],s=0;for(let i=0;i<=M;i++){m.push([]);for(let j=0;j<=M;j++)m[i].push(ph[i]*pa[j]);}
  m[0][0]*=1-lh*la*rho;m[0][1]*=1+lh*rho;m[1][0]*=1+la*rho;m[1][1]*=1-rho;
  for(let i=0;i<=M;i++)for(let j=0;j<=M;j++){if(m[i][j]<0)m[i][j]=0;s+=m[i][j];}
  let pw=0,pd=0,pl=0,o25=0,btts=0,sc=[];
  for(let i=0;i<=M;i++)for(let j=0;j<=M;j++){let v=m[i][j]/s;
    if(i>j)pw+=v;else if(i==j)pd+=v;else pl+=v;
    if(i+j>=3)o25+=v;if(i>=1&&j>=1)btts+=v;
    if(i<7&&j<7)sc.push([i,j,v]);}
  sc.sort((a,b)=>b[2]-a[2]);
  return{lh,la,pw,pd,pl,o25,btts,top:sc.slice(0,5)};
}
// ---------- UI ----------
const $=s=>document.querySelector(s);
const namesByDe=Object.keys(DATA.teams).sort((a,b)=>DATA.teams[a].de.localeCompare(DATA.teams[b].de));
function fillSel(sel,s='') {sel.innerHTML=namesByDe.map(t=>`<option value="${t}" ${t===s?'selected':''}>${DATA.teams[t].de}</option>`).join('');}
fillSel($('#t1'),'Germany');fillSel($('#t2'),'Spain');
$('#venue').innerHTML='<option value="">— neutraler Platz —</option>'+
  Object.keys(DATA.stadien).map(c=>`<option value="${c}">${c} (${DATA.stadien[c].land})</option>`).join('');
function pct(x){return (x*100).toFixed(1)+'%';}
function bar(w,d,l){const f=v=>Math.max(v*100,0);
  return `<div class="bar"><i class="bw" style="width:${f(w)}%">${w>0.08?pct(w):''}</i>`+
  `<i class="bd" style="width:${f(d)}%">${d>0.08?pct(d):''}</i>`+
  `<i class="bl" style="width:${f(l)}%">${l>0.08?pct(l):''}</i></div>`;}
function renderMatch(){
  const h=$('#t1').value,a=$('#t2').value,v=$('#venue').value;
  if(h===a){$('#out').innerHTML='<p class="gr">Bitte zwei verschiedene Teams wählen.</p>';return;}
  const oh=mitAusfall(h,outH), oa=mitAusfall(a,outA);
  const r=predict(h,a,v,oh,oa),T=DATA.teams;
  const tip=r.pw>=r.pd&&r.pw>=r.pl?T[h].de:(r.pl>=r.pd?T[a].de:'Unentschieden');
  $('#out').innerHTML=`
    <div class="big">${T[h].de} &nbsp;vs&nbsp; ${T[a].de}${v?` <span class="gr">@ ${v}</span>`:' <span class="gr">(neutral)</span>'}</div>
    ${bar(r.pw,r.pd,r.pl)}
    <div class="stat"><span>Sieg ${T[h].de}</span><b>${pct(r.pw)}</b></div>
    <div class="stat"><span>Unentschieden</span><b>${pct(r.pd)}</b></div>
    <div class="stat"><span>Sieg ${T[a].de}</span><b>${pct(r.pl)}</b></div>
    <div class="big" style="margin-top:12px">Tipp: <span class="win">${tip}</span></div>
    <div class="stat"><span>Erwartete Tore</span><b>${r.lh.toFixed(2)} : ${r.la.toFixed(2)}</b></div>
    <div class="stat"><span>Über 2,5 Tore</span><b>${pct(r.o25)}</b></div>
    <div class="stat"><span>Beide treffen</span><b>${pct(r.btts)}</b></div>
    <div style="margin-top:10px">Wahrscheinlichste Ergebnisse:</div>
    <div class="scores">${r.top.map(s=>`<span>${s[0]}:${s[1]} &nbsp;<b>${pct(s[2])}</b></span>`).join('')}</div>`;
  $('#sum1').textContent=`⚕ ${T[h].de}: Ausfälle wählen`+(outH.size?` (${outH.size} raus)`:'');
  $('#sum2').textContent=`⚕ ${T[a].de}: Ausfälle wählen`+(outA.size?` (${outA.size} raus)`:'');
  // Quoten-Check pro Spiel
  const probs=[r.pw,r.pd,r.pl], labs=[T[h].de,'Remis',T[a].de];
  let oh2='';
  ['#o1','#ox','#o2'].forEach((id,i)=>{const q=parseFloat($(id).value);
    if(q>1){const ev=probs[i]*q-1, ok=ev>0;
      oh2+=`<div class="stat"><span>${labs[i]} @ ${q.toFixed(2)} (fair ${(1/probs[i]).toFixed(2)})</span>`+
           `<b class="${ok?'val':'gr'}">${ok?'+':''}${(ev*100).toFixed(0)}% EV${ok?' ✓ Value':''}</b></div>`;}});
  $('#oddsout').innerHTML=oh2||'<span class="gr" style="font-size:12px">Quoten eingeben für den Value-Check…</span>';
}
const outH=new Set(), outA=new Set();
function buildSquad(divId,team,outSet){
  const ps=DATA.players[team]||[], box=$('#'+divId);
  box.innerHTML=ps.map((p,i)=>`<label class="pl${outSet.has(p.name)?' out':''}"><input type="checkbox" data-i="${i}" ${outSet.has(p.name)?'':'checked'}> <span>${p.name}</span> <span class="gr">${p.pos} · ${p.value}M · ${p.caps||0} LS</span></label>`).join('');
  box.onchange=e=>{const i=+e.target.dataset.i,name=ps[i].name;
    if(e.target.checked)outSet.delete(name);else outSet.add(name);
    e.target.closest('.pl').classList.toggle('out',!e.target.checked);renderMatch();};
}
$('#t1').addEventListener('change',()=>{outH.clear();buildSquad('squad1',$('#t1').value,outH);renderMatch();});
$('#t2').addEventListener('change',()=>{outA.clear();buildSquad('squad2',$('#t2').value,outA);renderMatch();});
$('#venue').addEventListener('change',renderMatch);
['#o1','#ox','#o2'].forEach(id=>$(id).addEventListener('input',renderMatch));
buildSquad('squad1',$('#t1').value,outH);
buildSquad('squad2',$('#t2').value,outA);
renderMatch();
// Value-Bereich (Weltmeister-Markt: Modell vs Buchmacher), nach Stufen
function renderValue(){
  const sim={}; DATA.sim.forEach(s=>sim[s.team]=s.titel);
  const odds=DATA.odds; let impl={},over=0;
  for(const t in odds){impl[t]=1/odds[t];over+=impl[t];}
  const rows=Object.keys(odds).map(t=>{const mp=(sim[t]||0)/100,fair=impl[t]/over,q=odds[t];
    return {t,mp,fair,q,ev:mp*q-1,fak:fair>0?mp/fair:0,
            stufe:q<=15?'Favoriten':(q<=80?'Mittelfeld':'Außenseiter')};});
  const dogs=rows.filter(r=>r.stufe==='Außenseiter'&&r.ev>0.05).sort((a,b)=>b.ev-a.ev);
  let h=`<div class="muted">Modell-% vs. faire Buchmacher-% (Marge ${((over-1)*100).toFixed(0)}% raus). <b>×</b> = wie viel mehr Chance das Modell gibt. <b class="val">EV&gt;0 = Value</b>. Quote editierbar (Enter). ⚠️ kein Backtest — große Abweichung kann auch Modell-Fehler sein.</div>`;
  if(dogs.length) h+=`<div class="card" style="background:#13241c;border-color:var(--ac);margin:10px 0;padding:12px">`+
    `<b class="val">🐺 Außenseiter mit Value</b><br>${dogs.map(d=>`${DATA.teams[d.t].de} — Quote ${d.q}, Modell gibt ${d.fak.toFixed(1)}× mehr Chance (EV +${(d.ev*100).toFixed(0)}%)`).join('<br>')}</div>`;
  ['Favoriten','Mittelfeld','Außenseiter'].forEach(st=>{
    const teil=rows.filter(r=>r.stufe===st).sort((a,b)=>b.ev-a.ev);
    h+=`<div class="big" style="margin-top:14px">${st}</div>`;
    h+='<table><tr><th>Team</th><th class="n">Modell</th><th class="n">Buchm.</th><th class="n">×</th><th class="n">Quote</th><th class="n">EV</th></tr>';
    teil.forEach(r=>{const ok=r.ev>0.05;
      h+=`<tr><td>${DATA.teams[r.t]?DATA.teams[r.t].de:r.t}</td>`+
        `<td class="n">${(r.mp*100).toFixed(1)}%</td>`+
        `<td class="n gr">${(r.fair*100).toFixed(1)}%</td>`+
        `<td class="n ${r.fak>=1.5?'val':'gr'}">${r.fak.toFixed(1)}×</td>`+
        `<td class="n"><input type="number" step="0.5" class="oq" data-t="${r.t}" value="${r.q}"></td>`+
        `<td class="n ${ok?'val':'gr'}">${r.ev>0?'+':''}${(r.ev*100).toFixed(0)}%</td></tr>`;});
    h+='</table>';
  });
  $('#vOut').innerHTML=h;
  $('#vOut').onchange=e=>{if(e.target.classList.contains('oq')){
    const v=parseFloat(e.target.value); if(v>1){DATA.odds[e.target.dataset.t]=v; renderValue();}}};
}
function renderValueMatches(){
  const T=DATA.teams,fx=DATA.fixtures;
  let h=`<div class="muted">Quoten eintragen (Platzhalter = faire Quote laut Modell). <b class="val">EV&gt;0 = Value</b>, 🐺 = Value liegt auf dem Außenseiter. „🐺 Außenseiter-Chance" sortiert nach den Spielen, wo das Modell dem Underdog am meisten zutraut.</div>`;
  h+=`<div style="margin:8px 0;display:flex;gap:6px;flex-wrap:wrap"><button class="mini" id="sortev">⬇ nach Value</button> <button class="mini" id="sortdog">🐺 Außenseiter-Chance</button> <button class="mini" id="sortdt">nach Datum</button></div>`;
  h+='<table id="vmt"><tr><th>Spiel</th><th class="n">1/X/2<br>Modell</th><th>deine Quoten (1·X·2)</th><th class="n">Value</th></tr>';
  fx.forEach((f,i)=>{const r=predict(f.heim,f.gast,f.stadt),fp=[1/r.pw,1/r.pd,1/r.pl];
    const dogHome=r.pw<r.pl, dogTeam=dogHome?T[f.heim].de:T[f.gast].de, dogp=Math.min(r.pw,r.pl), dogk=dogHome?0:2;
    h+=`<tr data-i="${i}" data-pw="${r.pw}" data-pd="${r.pd}" data-pl="${r.pl}" data-dogp="${dogp}" data-dogk="${dogk}">`+
      `<td>${T[f.heim].de} – ${T[f.gast].de}<br><span class="gr">${f.gruppe} · ${f.datum.slice(5)} · 🐺 ${dogTeam} ${(dogp*100).toFixed(0)}%</span></td>`+
      `<td class="n gr">${(r.pw*100).toFixed(0)}/${(r.pd*100).toFixed(0)}/${(r.pl*100).toFixed(0)}</td>`+
      `<td><input class="mo" data-i="${i}" type="number" step="0.01" placeholder="${fp[0].toFixed(2)}">`+
      `<input class="mo" data-i="${i}" type="number" step="0.01" placeholder="${fp[1].toFixed(2)}">`+
      `<input class="mo" data-i="${i}" type="number" step="0.01" placeholder="${fp[2].toFixed(2)}"></td>`+
      `<td class="n gr" id="ev${i}">–</td></tr>`;});
  $('#vMatch').innerHTML=h+'</table>';
  $('#vMatch').oninput=e=>{if(!e.target.classList.contains('mo'))return;
    const i=+e.target.dataset.i, row=document.querySelector('#vmt tr[data-i="'+i+'"]');
    const ps=[+row.dataset.pw,+row.dataset.pd,+row.dataset.pl], dogk=+row.dataset.dogk;
    const f=DATA.fixtures[i], labs=[T[f.heim].de,'X',T[f.gast].de];
    const ins=[...row.querySelectorAll('.mo')].map(x=>parseFloat(x.value));
    let best=null; ins.forEach((q,k)=>{if(q>1){const ev=ps[k]*q-1; if(!best||ev>best.ev)best={ev,k};}});
    const cell=document.querySelector('#ev'+i);
    if(!best){cell.textContent='–';cell.className='n gr';row.dataset.bestev='-99';}
    else{const dog=(best.k===dogk&&best.ev>0)?' 🐺':'';
      cell.innerHTML=`${best.ev>0?'+':''}${(best.ev*100).toFixed(0)}% <span class="gr">${labs[best.k]}${dog}</span>`;
      cell.className='n '+(best.ev>0?'val':'gr');row.dataset.bestev=best.ev;}};
  const reorder=cmp=>{const t=document.querySelector('#vmt');[...t.querySelectorAll('tr[data-i]')].sort(cmp).forEach(r=>t.appendChild(r));};
  document.querySelector('#sortev').onclick=()=>reorder((a,b)=>(+(b.dataset.bestev||-99))-(+(a.dataset.bestev||-99)));
  document.querySelector('#sortdog').onclick=()=>reorder((a,b)=>(+b.dataset.dogp)-(+a.dataset.dogp));
  document.querySelector('#sortdt').onclick=()=>reorder((a,b)=>(+a.dataset.i)-(+b.dataset.i));
}
renderValue();
renderValueMatches();
document.querySelectorAll('.subnav .sub').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.subnav .sub').forEach(x=>x.classList.remove('on'));b.classList.add('on');
